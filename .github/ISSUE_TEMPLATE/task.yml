name: Task
description: CI/CD, Docker, GitHub Actions, 인프라, 문서, 환경·DB 설정, 배포 등 일반 작업을 관리합니다.
title: "task: "
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 진행할 작업을 간단하게 설명해주세요.
      placeholder: 작업의 목적과 내용을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 작업
      description: 필요한 세부 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 작업이 완료됐다고 판단할 수 있는 조건을 작성해주세요.
      placeholder: 완료 조건을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 자료나 추가로 공유할 내용이 있다면 작성해주세요.
      placeholder: 참고할 내용을 작성해주세요.
