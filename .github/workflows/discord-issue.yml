name: Discord Issue Notification

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  notify:
    name: Send Discord notification
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send issue notification to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          DISCORD_MENTION_ENABLED: ${{ vars.DISCORD_MENTION_ENABLED }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "DISCORD_ISSUE_WEBHOOK secret is not configured."
            exit 1
          fi

          mention=""
          allowed_roles='[]'

          if [[ "${DISCORD_MENTION_ENABLED,,}" == "true" ]]; then
            if [[ ! "${DISCORD_ROLE_ID}" =~ ^[0-9]{17,20}$ ]]; then
              echo "DISCORD_ROLE_ID must be a 17-20 digit Discord role ID when mentions are enabled."
              exit 1
            fi

            mention="<@&${DISCORD_ROLE_ID}>"
            allowed_roles="$(jq -cn --arg role_id "${DISCORD_ROLE_ID}" '[$role_id]')"
          fi

          payload="$(
            jq -cn \
              --arg content "${mention}" \
              --arg repository "${REPOSITORY}" \
              --arg title "${ISSUE_TITLE}" \
              --arg url "${ISSUE_URL}" \
              --arg number "${ISSUE_NUMBER}" \
              --arg author "${ISSUE_AUTHOR}" \
              --argjson roles "${allowed_roles}" \
              '{
                content: $content,
                allowed_mentions: {
                  parse: [],
                  roles: $roles
                },
                embeds: [
                  {
                    title: ("📝 새 GitHub Issue #" + $number),
                    url: $url,
                    description: ("**" + $title + "**"),
                    color: 16753920,
                    fields: [
                      {name: "저장소", value: $repository, inline: false},
                      {name: "작성자", value: $author, inline: true}
                    ],
                    footer: {text: "GitHub Issue"}
                  }
                ]
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${DISCORD_WEBHOOK_URL}"
