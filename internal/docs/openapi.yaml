openapi: 3.0.3
info:
  title: SceneSpect API
  version: 1.0.0
  description: |
    회원 인증, OAuth 계정, 팀·프로젝트 권한 및 프로필 설정 API입니다.
    변경 요청은 로그인 후 `Authorization: Bearer <accessToken>` 헤더를 사용합니다.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: OAuth
  - name: Teams
  - name: Projects
  - name: Media
  - name: System
paths:
  /healthz:
    get:
      tags: [System]
      summary: 서버 상태 확인
      responses:
        '200': { description: 정상 상태 }
  /api/v1/auth/signup/terms:
    get:
      tags: [Auth]
      summary: 현재 가입 약관 조회
      responses:
        '200': { description: 약관 목록 }
    post:
      tags: [Auth]
      summary: 약관 동의 및 가입 완료
      security: []
      description: 이메일 가입 완료 요청은 signupSessionId를 사용합니다. OAuth 가입은 `/oauth/complete`를 사용합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupComplete' }
      responses:
        '201': { description: 계정 생성 및 Access Token 발급, Refresh Token은 HttpOnly 쿠키로 설정 }
        '422': { description: 필수 약관 미동의 }
  /api/v1/auth/signup/start:
    post:
      tags: [Auth]
      summary: 이메일 가입 세션 시작
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '201': { description: 가입 세션과 기본 닉네임 }
        '409': { description: 이메일 중복 }
  /api/v1/auth/signup/password:
    post:
      tags: [Auth]
      summary: 가입 비밀번호 설정
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signupSessionId, password, passwordConfirmation]
              properties:
                signupSessionId: { type: string }
                password: { type: string, minLength: 12, maxLength: 72 }
                passwordConfirmation: { type: string }
      responses:
        '200': { description: 이메일 인증 단계로 진행 }
  /api/v1/auth/signup/email/send:
    post:
      tags: [Auth]
      summary: 가입 이메일 인증 코드 발송
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signupSessionId]
              properties: { signupSessionId: { type: string } }
      responses:
        '200': { description: 인증 코드 발송 }
        '429': { description: 발송 제한 }
  /api/v1/auth/signup/email/verify:
    post:
      tags: [Auth]
      summary: 가입 이메일 인증
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signupSessionId, code]
              properties:
                signupSessionId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: 약관 동의 단계로 진행 }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 이메일 또는 아이디 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Access Token 및 사용자 정보, Refresh Token 쿠키 설정 }
        '401': { description: 인증 실패 }
  /api/v1/auth/token/refresh:
    post:
      tags: [Auth]
      summary: Refresh Token 회전 및 Access Token 재발급
      security: [{ RefreshCookie: [] }]
      responses:
        '200': { description: 새 Access Token과 회전된 HttpOnly Refresh Token 쿠키 }
        '401': { description: Refresh Token 만료 또는 재사용 감지 }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 현재 세션 로그아웃
      security: [{ RefreshCookie: [] }]
      responses:
        '204': { description: Refresh Token 폐기 및 쿠키 삭제 }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: 비밀번호 재설정 안내 요청
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202': { description: 계정 존재 여부를 노출하지 않고 접수 }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: 재설정 토큰으로 비밀번호 변경
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, passwordConfirmation]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 72 }
                passwordConfirmation: { type: string }
      responses:
        '200': { description: 비밀번호 변경 및 기존 세션 폐기 }
  /api/v1/auth/account/find:
    post:
      tags: [Auth]
      summary: 이메일 또는 아이디로 계정 찾기
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties: { login: { type: string } }
      responses:
        '200': { description: 마스킹된 이메일과 로그인 아이디 }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 내 계정 정보 조회
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 사용자 프로필 }
  /api/v1/auth/me/nickname:
    patch:
      tags: [Auth]
      summary: 닉네임 변경
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties: { nickname: { type: string, minLength: 1, maxLength: 50 } }
      responses:
        '200': { description: 변경된 사용자 정보 }
        '409': { description: 닉네임 중복 }
  /api/v1/auth/me/profile:
    patch:
      tags: [Auth]
      summary: 닉네임과 프로필 사진 수정
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 1, maxLength: 50 }
                avatarUrl: { type: string, description: 업로드 응답 URL 또는 HTTPS 이미지 URL }
      responses:
        '200': { description: 변경된 사용자 정보 }
  /api/v1/auth/me/display-theme:
    patch:
      tags: [Auth]
      summary: 화면 테마 변경
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayTheme]
              properties:
                displayTheme: { type: string, enum: [LIGHT, DARK, SYSTEM] }
      responses:
        '200': { description: 변경된 사용자 정보 }
  /api/v1/auth/me/password:
    post:
      tags: [Auth]
      summary: 로그인 상태에서 비밀번호 변경
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password, passwordConfirmation]
              properties:
                currentPassword: { type: string, format: password }
                password: { type: string, minLength: 12, maxLength: 72 }
                passwordConfirmation: { type: string, format: password }
      responses:
        '204': { description: 비밀번호 변경 및 모든 기존 Refresh Token 폐기 }
        '401': { description: 현재 비밀번호 불일치 }
  /api/v1/auth/oauth/{provider}/start:
    get:
      tags: [OAuth]
      summary: 소셜 로그인 시작
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '302': { description: OAuth 제공자 인증 화면으로 이동 }
        '404': { description: 제공자 설정이 비활성화됨 }
  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: Google, Kakao, X OAuth callback
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '303': { description: 기존 계정은 앱 callback, 신규 계정은 동의 화면으로 이동 }
  /api/v1/auth/oauth/apple/callback:
    post:
      tags: [OAuth]
      summary: Apple form_post callback
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code, state]
              properties: { code: { type: string }, state: { type: string }, user: { type: string } }
      responses:
        '303': { description: 앱 callback 또는 소셜 가입 동의 화면으로 이동 }
  /api/v1/auth/oauth/{provider}/link/start:
    post:
      tags: [OAuth]
      summary: 로그인한 계정에 소셜 계정 연결 시작
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200': { description: authorizationUrl 반환 }
        '409': { description: 이미 다른 계정에 연결된 소셜 계정 }
  /api/v1/auth/oauth/complete/email/send:
    post:
      tags: [OAuth]
      summary: 이메일 정보가 없는 소셜 가입자의 이메일 인증 코드 발송
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oauthSessionId, email]
              properties: { oauthSessionId: { type: string }, email: { type: string, format: email } }
      responses:
        '200': { description: 인증 코드 발송 }
        '409': { description: 기존 SceneSpect 계정과 이메일 중복 }
  /api/v1/auth/oauth/complete/email/verify:
    post:
      tags: [OAuth]
      summary: 소셜 가입 이메일 인증
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oauthSessionId, code]
              properties: { oauthSessionId: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' } }
      responses:
        '200': { description: 이메일 인증 완료 }
  /api/v1/auth/oauth/complete:
    post:
      tags: [OAuth]
      summary: 약관 동의 후 소셜 계정 가입 완료
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oauthSessionId, consents]
              properties:
                oauthSessionId: { type: string }
                nickname: { type: string, maxLength: 50 }
                consents: { type: array, items: { $ref: '#/components/schemas/Consent' } }
      responses:
        '201': { description: 사용자와 OAuth 연결 생성, Access Token 응답 및 Refresh Token 쿠키 설정 }
        '422': { description: 필수 약관 미동의 }
  /api/v1/teams:
    get:
      tags: [Teams]
      summary: 내가 속한 팀 목록 조회
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 팀 목록 }
    post:
      tags: [Teams]
      summary: 팀 생성
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 4000 }
      responses:
        '201': { description: 생성한 팀과 초대 코드 }
        '409': { description: 팀 이름 중복 }
  /api/v1/teams/name-availability:
    get:
      tags: [Teams]
      summary: 팀 이름 사용 가능 여부 확인
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: excludeTeamId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: available boolean }
  /api/v1/teams/order:
    put:
      tags: [Teams]
      summary: 팀 목록 순서 저장
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamIds]
              properties: { teamIds: { type: array, maxItems: 100, items: { type: string, format: uuid } } }
      responses:
        '204': { description: 저장 완료 }
  /api/v1/teams/join-requests:
    post:
      tags: [Teams]
      summary: 초대 코드로 팀 가입 신청
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinCode, nickname]
              properties: { joinCode: { type: string }, nickname: { type: string, maxLength: 50 } }
      responses:
        '201': { description: 가입 신청 생성 }
  /api/v1/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: 팀 상세 조회
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 팀 상세 정보와 현재 사용자 역할 }
    patch:
      tags: [Teams]
      summary: 팀 정보 수정
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                youtubeUrl: { type: string, format: uri }
                guideline: { type: string }
                avatarUrl: { type: string, format: uri }
      responses:
        '200': { description: 수정된 팀 정보 }
        '403': { description: 팀장 또는 부팀장 권한 필요 }
    delete:
      tags: [Teams]
      summary: 팀 삭제
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: 팀과 하위 프로젝트 삭제, 팀장 전용 }
  /api/v1/teams/{teamId}/members:
    get:
      tags: [Teams]
      summary: 팀원 목록 조회
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200': { description: 프로필 이미지, 역할, 경고 수, 프로젝트 생성 권한을 포함한 팀원 목록 }
  /api/v1/teams/{teamId}/members/{userId}:
    delete:
      tags: [Teams]
      summary: 팀 탈퇴 또는 팀원 추방
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 팀원 제거 }
        '403': { description: 역할 권한 부족 }
  /api/v1/teams/{teamId}/members/{userId}/role:
    patch:
      tags: [Teams]
      summary: 팀장·부팀장·팀원 역할 변경
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { type: string, enum: [LEADER, DEPUTY, MEMBER] } }
      responses:
        '204': { description: 역할 변경 }
        '403': { description: 팀장 전용 }
  /api/v1/teams/{teamId}/members/{userId}/permissions:
    patch:
      tags: [Teams]
      summary: 팀원의 프로젝트 생성 권한 변경
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canCreateProjects]
              properties: { canCreateProjects: { type: boolean } }
      responses:
        '204': { description: 권한 변경 }
  /api/v1/teams/{teamId}/members/{userId}/warnings:
    post:
      tags: [Teams]
      summary: 팀원 경고 추가
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: 변경된 warningCount }
  /api/v1/teams/{teamId}/join-requests:
    get:
      tags: [Teams]
      summary: 팀 가입 신청 목록 조회
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200': { description: 대기 중인 가입 신청 목록 }
  /api/v1/teams/{teamId}/join-requests/{requestId}:
    patch:
      tags: [Teams]
      summary: 팀 가입 신청 승인 또는 거절
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '204': { description: 신청 처리 }
  /api/v1/teams/{teamId}/projects:
    get:
      tags: [Projects]
      summary: 팀 프로젝트 목록 조회
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - { name: sort, in: query, schema: { type: string, enum: [recent, name], default: recent } }
      responses:
        '200': { description: TEAM 프로젝트와 사용자에게 권한이 부여된 SELECTED 프로젝트 목록 }
    post:
      tags: [Projects]
      summary: 팀 프로젝트 생성
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201': { description: 생성된 프로젝트 }
        '403': { description: 프로젝트 생성 권한 없음 }
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: 프로젝트 상세 조회
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 프로젝트 상세 정보와 사용자의 접근 수준. TEAM 공개는 팀원에게 읽기 권한을 부여 }
    patch:
      tags: [Projects]
      summary: 프로젝트 정보 수정
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200': { description: 수정된 프로젝트 }
        '403': { description: EDITOR 또는 관리자 권한 필요 }
    delete:
      tags: [Projects]
      summary: 프로젝트 삭제
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: 프로젝트 삭제. 팀장 또는 부팀장 전용 }
        '403': { description: 팀장 또는 부팀장 권한 필요 }
  /api/v1/projects/{projectId}/members:
    get:
      tags: [Projects]
      summary: 프로젝트에 접근할 수 있는 팀원 조회
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 프로필 이미지와 접근 수준별 프로젝트 팀원 목록. TEAM 공개 프로젝트는 전체 팀원을 반환 }
  /api/v1/projects/{projectId}/permissions/{userId}:
    put:
      tags: [Projects]
      summary: 프로젝트 멤버 권한 부여 또는 변경
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessLevel]
              properties: { accessLevel: { type: string, enum: [VIEWER, EDITOR] } }
      responses:
        '204': { description: 권한 부여 완료 }
    delete:
      tags: [Projects]
      summary: 프로젝트 권한 회수
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 권한 회수 완료 }
  /api/v1/projects/{projectId}/access-requests:
    post:
      tags: [Projects]
      summary: 프로젝트 접근 또는 편집 권한 신청
      security: [{ BearerAuth: [] }]
      description: SELECTED 프로젝트는 VIEWER 또는 EDITOR를 신청할 수 있습니다. TEAM 프로젝트는 이미 읽을 수 있으므로 EDITOR만 신청할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessLevel: { type: string, enum: [VIEWER, EDITOR], default: VIEWER }
                message: { type: string, maxLength: 2000 }
      responses:
        '201': { description: 접근 신청 생성 }
        '409': { description: 이미 권한이 있거나 대기 중인 신청이 있음 }
  /api/v1/projects/{projectId}/delete-requests:
    post:
      tags: [Projects]
      summary: 프로젝트 삭제 신청
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { message: { type: string, maxLength: 2000 } }
      responses:
        '201': { description: 삭제 신청 생성 }
  /api/v1/teams/{teamId}/project-access-requests:
    get:
      tags: [Projects]
      summary: 팀의 프로젝트 접근 신청 목록 조회
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200': { description: 대기 중인 접근 신청 }
  /api/v1/teams/{teamId}/project-access-requests/{requestId}:
    patch:
      tags: [Projects]
      summary: 프로젝트 접근 신청 승인 또는 거절
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '204': { description: 신청 처리 }
  /api/v1/teams/{teamId}/project-delete-requests:
    get:
      tags: [Projects]
      summary: 팀의 프로젝트 삭제 신청 목록 조회
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200': { description: 대기 중인 삭제 신청 }
  /api/v1/teams/{teamId}/project-delete-requests/{requestId}:
    patch:
      tags: [Projects]
      summary: 프로젝트 삭제 신청 승인 또는 거절
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '204': { description: 승인 시 프로젝트 삭제, 거절 시 요청 보존 }
  /api/v1/media/images:
    post:
      tags: [Media]
      summary: 프로필·팀·프로젝트 이미지 업로드
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '201': { description: 저장된 이미지 URL }
        '413': { description: 이미지 용량 제한 초과 }
        '400': { description: JPEG 또는 PNG 이미지가 아님 }
  /media/{filename}:
    get:
      tags: [Media]
      summary: 업로드 이미지 조회
      security: []
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f-]+\.(jpg|png)$' } }
      responses:
        '200': { description: JPEG/PNG 이미지 }
        '404': { description: 이미지를 찾을 수 없음 }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: scenespect_refresh
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, kakao, x, apple] }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Consent:
      type: object
      required: [termId, accepted]
      properties:
        termId: { type: string, format: uuid }
        accepted: { type: boolean }
    SignupComplete:
      type: object
      required: [signupSessionId, consents]
      properties:
        signupSessionId: { type: string }
        consents: { type: array, items: { $ref: '#/components/schemas/Consent' } }
    ReviewRequest:
      type: object
      required: [accept]
      properties: { accept: { type: boolean } }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 8000 }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        visibility: { type: string, enum: [TEAM, SELECTED], default: TEAM, description: 생성 시 기본값은 TEAM입니다. 수정 시 생략하면 기존 범위를 유지합니다. TEAM은 팀 전체 읽기 허용, SELECTED는 지정 멤버만 접근 }
