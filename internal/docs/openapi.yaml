  /media/{filename}:
    get:
      tags: [Media]
      summary: 업로드 이미지 조회
      security: []
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f-]+\.(jpg|png)$' } }
      responses:
        '200':
          description: JPEG/PNG 이미지
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: 이미지를 찾을 수 없음
          content:
            text/plain:
              example: "404 page not found"
        default:
          description: 예상하지 못한 서버 오류. 응답 본문 형식은 공통 오류 형식입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {"error": "서버 오류가 발생했습니다"}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인 응답의 accessToken 값을 입력하세요. Bearer 접두사는 Swagger UI가 추가합니다.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: scenespect_refresh
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, example: "입력값을 확인해 주세요" }
    Consent:
      type: object
      required: [termId, accepted]
      properties:
        termId: { type: string, format: uuid }
        accepted: { type: boolean }
    SignupComplete:
      type: object
      required: [signupSessionId, consents]
      properties:
        signupSessionId: { type: string }
        consents: { type: array, items: { $ref: '#/components/schemas/Consent' } }
    ReviewRequest:
      type: object
      required: [accept]
      properties: { accept: { type: boolean } }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 8000 }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        visibility: { type: string, enum: [TEAM, SELECTED], default: TEAM, description: 생성 시 기본값은 TEAM입니다. 수정 시 생략하면 기존 범위를 유지합니다. TEAM은 팀 전체 읽기 허용, SELECTED는 지정 멤버만 접근 }
